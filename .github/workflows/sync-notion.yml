name: Sync Notion

on:
  schedule:
    - cron: '7,37 * * * *'   # 每 30 分鐘讀一次 Notion
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Notion and rewrite index.html
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Notion 沒有新的變更"
          else
            git config user.name "notion-sync"
            git config user.email "notion-sync@users.noreply.github.com"
            git add index.html
            git commit -m "Sync from Notion"
            git push
          fi
